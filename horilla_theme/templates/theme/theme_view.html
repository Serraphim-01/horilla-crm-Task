{% extends "index.html" %}
{% load static i18n %}

{% block content %}
<div class="modelcontent">
  <div id="mainContent" class="p-4">
    <div class="col-span-12">
      <div class="bg-white rounded-xl [box-shadow:0px_0px_20px_0px_rgb(0_0_0_/_5%)] p-5 h-[calc(_100vh_-_160px_)] overflow-x-auto custom-scroll">
        <div class="mb-6">
          <h2 class="text-md font-semibold text-gray-900 mb-2">{% trans 'Theme Management' %}</h2>
          <p class="text-xs text-gray-600">{% trans 'Select a theme to customize the appearance of your application' %}</p>
        </div>

        <div id="theme-cards-container">
          {% include "theme/theme_cards.html" %}
        </div>
        <script>
          // Handle HTMX response and reload page to apply theme
          document.body.addEventListener('htmx:afterSwap', function(event) {
            if (event.detail.target && event.detail.target.id === 'theme-cards-container') {
              window.location.reload();
            }
          });
        </script>
      </div>
    </div>
  </div>
</div>
{% endblock %}
